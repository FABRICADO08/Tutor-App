version: 2

updates:
  # ============================================================
  # NPM: scan package manifests throughout the entire repository
  # ============================================================
  - package-ecosystem: "npm"

    directories:
      - "/"
      - "/*"
      - "/**/*"

    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "Africa/Johannesburg"

    target-branch: "main"
    open-pull-requests-limit: 20
    rebase-strategy: "auto"
    versioning-strategy: "increase"

    labels:
      - "dependencies"
      - "npm"
      - "automated"
      - "security"

    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"

    groups:
      npm-security-updates:
        applies-to: "security-updates"
        patterns:
          - "*"

      npm-production-updates:
        applies-to: "version-updates"
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"

      npm-development-updates:
        applies-to: "version-updates"
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"

    cooldown:
      default-days: 3
      semver-major-days: 14
      semver-minor-days: 3
      semver-patch-days: 2

  # ============================================================
  # GitHub Actions: scan every workflow in the repository
  # ============================================================
  - package-ecosystem: "github-actions"
    directory: "/"

    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:30"
      timezone: "Africa/Johannesburg"

    target-branch: "main"
    open-pull-requests-limit: 10
    rebase-strategy: "auto"

    labels:
      - "dependencies"
      - "github-actions"
      - "automated"

    commit-message:
      prefix: "ci"
      include: "scope"

    groups:
      github-actions-updates:
        patterns:
          - "*"

    cooldown:
      default-days: 3
      semver-major-days: 14
      semver-minor-days: 3
      semver-patch-days: 2
