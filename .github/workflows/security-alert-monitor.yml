name: Security Alert Monitor and Remediation

on:
  push:
    branches:
      - main

  schedule:
    - cron: "00 * * * *"

  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  monitor:
    name: Check security alerts
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Validate SYNC_TOKEN
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::SYNC_TOKEN is missing."
            exit 1
          fi

          gh api user --jq '"Authenticated as: " + .login'

      - name: Check alerts and request supported fixes
        id: security
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.SYNC_TOKEN }}
          retries: 2
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            let codeScanningAlerts = [];
            let dependabotAlerts = [];

            let codeScanningAssigned = 0;
            let codeScanningAlreadyAssigned = 0;
            let codeScanningUnsupported = 0;
            let retrievalFailures = 0;

            const headers = {
              accept: "application/vnd.github+json"
            };

            try {
              codeScanningAlerts = await github.paginate(
                github.rest.codeScanning.listAlertsForRepo,
                {
                  owner,
                  repo,
                  state: "open",
                  ref: "refs/heads/main",
                  per_page: 100,
                  headers
                }
              );

              core.info(
                `Open code-scanning alerts: ${codeScanningAlerts.length}`
              );
            } catch (error) {
              retrievalFailures++;

              core.error(
                `Could not retrieve code-scanning alerts: ${error.message}`
              );
            }

            for (const alert of codeScanningAlerts) {
              const rule =
                alert.rule?.description ??
                alert.rule?.name ??
                alert.rule?.id ??
                "Unknown code-scanning rule";

              core.warning(
                `Code-scanning alert #${alert.number}: ${rule}`
              );

              const existingAssignees =
                alert.assignees?.map(
                  assignee => assignee.login.toLowerCase()
                ) ?? [];

              const copilotAccounts = [
                "copilot-swe-agent[bot]",
                "copilot-swe-agent [bot]"
              ];

              const alreadyAssigned =
                existingAssignees.some(
                  assignee => copilotAccounts.includes(assignee)
                );

              if (alreadyAssigned) {
                codeScanningAlreadyAssigned++;

                core.info(
                  `Code-scanning alert #${alert.number} is already assigned to Copilot.`
                );

                continue;
              }

              try {
                await github.request(
                  "PATCH /repos/{owner}/{repo}/code-scanning/alerts/{alert_number}",
                  {
                    owner,
                    repo,
                    alert_number: alert.number,
                    assignees: ["copilot-swe-agent [bot]"],
                    headers
                  }
                );

                codeScanningAssigned++;

                core.notice(
                  `Code-scanning alert #${alert.number} was assigned to Copilot.`
                );
              } catch (error) {
                /*
                 * An unsupported alert should be reported but should
                 * not cause the monitoring workflow to fail.
                 */
                if (
                  error.status === 422 ||
                  error.message.includes(
                    "Copilot cannot be assigned"
                  )
                ) {
                  codeScanningUnsupported++;

                  core.warning(
                    `Code-scanning alert #${alert.number} does not support Agentic Autofix and requires a manual fix.`
                  );
                } else {
                  codeScanningUnsupported++;

                  core.warning(
                    `Code-scanning alert #${alert.number} could not be assigned: ${error.message}`
                  );
                }
              }
            }

            try {
              dependabotAlerts = await github.paginate(
                "GET /repos/{owner}/{repo}/dependabot/alerts",
                {
                  owner,
                  repo,
                  state: "open",
                  per_page: 100,
                  headers
                }
              );

              core.info(
                `Open Dependabot alerts: ${dependabotAlerts.length}`
              );
            } catch (error) {
              retrievalFailures++;

              core.error(
                `Could not retrieve Dependabot alerts: ${error.message}`
              );
            }

            let dependabotPatchAvailable = 0;
            let dependabotNoPatchAvailable = 0;

            for (const alert of dependabotAlerts) {
              const packageName =
                alert.dependency?.package?.name ??
                "Unknown dependency";

              const severity =
                alert.security_advisory?.severity ??
                "unknown";

              const patchedVersion =
                alert.security_vulnerability
                  ?.first_patched_version
                  ?.identifier ??
                null;

              if (patchedVersion) {
                dependabotPatchAvailable++;

                core.warning(
                  `Dependabot alert #${alert.number}: ${packageName}, severity=${severity}, patched version=${patchedVersion}`
                );
              } else {
                dependabotNoPatchAvailable++;

                core.warning(
                  `Dependabot alert #${alert.number}: ${packageName}, severity=${severity}, no patched version currently reported`
                );
              }
            }

            const totalOpen =
              codeScanningAlerts.length +
              dependabotAlerts.length;

            core.setOutput(
              "code_scanning_open",
              String(codeScanningAlerts.length)
            );

            core.setOutput(
              "code_scanning_assigned",
              String(codeScanningAssigned)
            );

            core.setOutput(
              "code_scanning_already_assigned",
              String(codeScanningAlreadyAssigned)
            );

            core.setOutput(
              "code_scanning_unsupported",
              String(codeScanningUnsupported)
            );

            core.setOutput(
              "dependabot_open",
              String(dependabotAlerts.length)
            );

            core.setOutput(
              "dependabot_patch_available",
              String(dependabotPatchAvailable)
            );

            core.setOutput(
              "dependabot_no_patch_available",
              String(dependabotNoPatchAvailable)
            );

            core.setOutput(
              "retrieval_failures",
              String(retrievalFailures)
            );

            core.setOutput(
              "total_open",
              String(totalOpen)
            );

            if (totalOpen === 0) {
              core.notice(
                "No Code Scanning or Dependabot alerts remain open."
              );
            } else {
              core.warning(
                `${totalOpen} security alert(s) remain open.`
              );
            }

      - name: Create security summary
        if: always()
        env:
          EVENT_NAME: ${{ github.event_name }}
          CODE_SCANNING_OPEN: ${{ steps.security.outputs.code_scanning_open }}
          CODE_SCANNING_ASSIGNED: ${{ steps.security.outputs.code_scanning_assigned }}
          CODE_SCANNING_ALREADY_ASSIGNED: ${{ steps.security.outputs.code_scanning_already_assigned }}
          CODE_SCANNING_UNSUPPORTED: ${{ steps.security.outputs.code_scanning_unsupported }}
          DEPENDABOT_OPEN: ${{ steps.security.outputs.dependabot_open }}
          DEPENDABOT_PATCH_AVAILABLE: ${{ steps.security.outputs.dependabot_patch_available }}
          DEPENDABOT_NO_PATCH_AVAILABLE: ${{ steps.security.outputs.dependabot_no_patch_available }}
          RETRIEVAL_FAILURES: ${{ steps.security.outputs.retrieval_failures }}
          TOTAL_OPEN: ${{ steps.security.outputs.total_open }}
        run: |
          {
            echo "## Security alert check"
            echo ""
            echo "- Trigger: ${EVENT_NAME}"
            echo "- Open code-scanning alerts: ${CODE_SCANNING_OPEN:-0}"
            echo "- Newly assigned to Copilot: ${CODE_SCANNING_ASSIGNED:-0}"
            echo "- Already assigned to Copilot: ${CODE_SCANNING_ALREADY_ASSIGNED:-0}"
            echo "- Alerts requiring manual correction: ${CODE_SCANNING_UNSUPPORTED:-0}"
            echo "- Open Dependabot alerts: ${DEPENDABOT_OPEN:-0}"
            echo "- Dependabot alerts with patches: ${DEPENDABOT_PATCH_AVAILABLE:-0}"
            echo "- Dependabot alerts without patches: ${DEPENDABOT_NO_PATCH_AVAILABLE:-0}"
            echo "- Retrieval failures: ${RETRIEVAL_FAILURES:-0}"
            echo ""

            if [ "${TOTAL_OPEN:-0}" = "0" ]; then
              echo "### Result"
              echo "No security alerts remain open."
            else
              echo "### Result"
              echo "${TOTAL_OPEN:-0} security alert(s) remain open."
              echo ""

              if [ "${CODE_SCANNING_ASSIGNED:-0}" -gt 0 ]; then
                echo "- ${CODE_SCANNING_ASSIGNED} code-scanning alert(s) were assigned to Copilot."
              fi

              if [ "${CODE_SCANNING_UNSUPPORTED:-0}" -gt 0 ]; then
                echo "- ${CODE_SCANNING_UNSUPPORTED} code-scanning alert(s) require manual correction."
              fi

              if [ "${DEPENDABOT_PATCH_AVAILABLE:-0}" -gt 0 ]; then
                echo "- ${DEPENDABOT_PATCH_AVAILABLE} Dependabot alert(s) have patched versions."
              fi

              echo "- Dependabot pull requests will be validated and configured for automatic merging."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Finish monitoring
        if: always()
        env:
          RETRIEVAL_FAILURES: ${{ steps.security.outputs.retrieval_failures }}
        run: |
          if [ "${RETRIEVAL_FAILURES:-0}" -gt 0 ]; then
            echo "::error::One or more security APIs could not be queried."
            exit 1
          fi

          echo "Security monitoring completed successfully."

  dependabot-fix:
    name: Validate and merge Dependabot fix
    if: |
      github.event_name == 'pull_request' &&
      github.actor == 'dependabot[bot]'
    runs-on: ubuntu-24.04

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Check out Dependabot change
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.3
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm run --if-present lint

      - name: Run tests
        run: pnpm run --if-present test
        env:
          CI: true

      - name: Build application
        run: pnpm run --if-present build

      - name: Enable automatic merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr merge "$PR_URL" \
            --auto \
            --squash \
            --delete-branch

      - name: Add remediation summary
        run: |
          {
            echo "## Dependabot remediation"
            echo ""
            echo "- Pull request: #${{ github.event.pull_request.number }}"
            echo "- Dependency installation: passed"
            echo "- Lint: passed or not configured"
            echo "- Tests: passed or not configured"
            echo "- Build: passed or not configured"
            echo "- Automatic merge: enabled"
            echo ""
            echo "GitHub will merge the pull request after all required checks pass."
          } >> "$GITHUB_STEP_SUMMARY"
