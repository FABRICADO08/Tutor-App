name: Sync tutor-app-ho

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Tutor-App
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout tutor-app-ho (Source)
        uses: actions/checkout@v4
        with:
          repository: FABRICADO08/tutor-app-ho
          token: ${{ secrets.SYNC_TOKEN }}
          path: source-repo
          fetch-depth: 0

      - name: Merge Source Code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add source-local ./source-repo
          git fetch source-local

          git merge source-local/main \
            --allow-unrelated-histories \
            -X theirs \
            -m "Merge latest code from tutor-app-ho"

      - name: Push changes to Tutor-App
        run: |
          # Reconfigure origin to use your SYNC_TOKEN so it has workflow-write privileges
          git remote set-url origin https://x-access-token:${{ secrets.SYNC_TOKEN }}@github.com/FABRICADO08/Tutor-App.git
          git push origin main

      - name: Delete source repository tutor-app-ho (Optional)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          gh repo delete FABRICADO08/tutor-app-ho --yes
