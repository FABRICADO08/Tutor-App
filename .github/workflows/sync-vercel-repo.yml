name: Sync tutor-app-ho

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout Tutor-App
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SYNC_TOKEN }}
          fetch-depth: 0
          ref: main
          persist-credentials: true

      - name: Checkout tutor-app-ho source
        uses: actions/checkout@v4
        with:
          repository: FABRICADO08/tutor-app-ho
          token: ${{ secrets.SYNC_TOKEN }}
          path: source-repo
          fetch-depth: 0
          ref: main
          persist-credentials: false

      - name: Merge source code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote remove source-local 2>/dev/null || true
          git remote add source-local ./source-repo

          git fetch source-local main

          git merge source-local/main \
            --allow-unrelated-histories \
            -X theirs \
            -m "Merge latest code from tutor-app-ho"

      - name: Verify push authentication
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo "SYNC_TOKEN is missing or empty."
            exit 1
          fi

          echo "SYNC_TOKEN is configured."
          git remote -v

      - name: Push changes to Tutor-App
        run: git push origin HEAD:main
