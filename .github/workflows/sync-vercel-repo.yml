name: Sync tutor-app-ho

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Tutor-App
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add source repository with auth
        run: |
          git remote add tutor-app-ho https://x-access-token:${{ secrets.SYNC_TOKEN }}@github.com/FABRICADO08/tutor-app-ho.git
          git fetch tutor-app-ho

      - name: Replace with tutor-app-ho
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git reset --hard tutor-app-ho/main

      - name: Push changes
        run: |
          git push --force origin main
