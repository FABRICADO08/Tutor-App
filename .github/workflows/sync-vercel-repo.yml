name: Sync and Delete tutor-app-ho

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Tutor-App
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add source repository with Token
        run: |
          git remote add tutor-app-ho https://x-access-token:${{ secrets.SYNC_TOKEN }}@github.com/FABRICADO08/tutor-app-ho.git
          git fetch tutor-app-ho

      - name: Sync and Merge Code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git merge tutor-app-ho/main \
            --allow-unrelated-histories \
            -m "Merge latest code from tutor-app-ho"

      - name: Push changes to Tutor-App
        run: |
          git push origin main

      - name: Delete source repository tutor-app-ho
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          gh repo delete FABRICADO08/tutor-app-ho --yes
